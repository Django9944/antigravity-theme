  <text x="298" y="340" class="mono" font-size="11.5"><tspan fill="#55419a">  return </tspan><tspan fill="#192028">res;</tspan></text>
  <text x="298" y="360" class="mono" font-size="11.5"><tspan fill="#192028">}</tspan></text>

