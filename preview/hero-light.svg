  <text x="298" y="280" class="mono" font-size="11.5"><tspan fill="#55419a">export function </tspan><tspan fill="#005697">verifyGlassContrast</tspan><tspan fill="#192028">(fg: </tspan><tspan fill="#005f67">Hex</tspan><tspan fill="#192028">, bg: </tspan><tspan fill="#005f67">HexAlpha</tspan><tspan fill="#192028">) {</tspan></text>
  <text x="298" y="300" class="mono" font-size="11.5"><tspan fill="#55419a">  const </tspan><tspan fill="#192028">res = </tspan><tspan fill="#005697">worstCaseGlassContrast</tspan><tspan fill="#192028">(fg, bg);</tspan></text>
