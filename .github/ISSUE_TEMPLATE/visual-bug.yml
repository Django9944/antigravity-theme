name: Visual, Runtime or Installer Bug
description: Report a readability/contrast defect, floating switcher issue, or macOS/Windows ASAR installer failure.
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Note: **Antigravity Theme** exclusively targets the **Antigravity 2.0 Agent Desktop App** (code editors such as Antigravity IDE / VS Code are out of scope; see `VISION.md`).
        Report **one** concrete issue per submission grounded in observed evidence. If a field cannot be answered from available evidence, write `NOT_ENOUGH_INFO`.
        Remove any personal tokens, credentials, or private workspace paths before submitting.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing open and closed issues for duplicates.
          required: true
        - label: I removed all secrets, tokens, and sensitive personal paths from logs and screenshots.
          required: true

  - type: dropdown
    id: variant
    attributes:
      label: Theme Variant
      options:
        - Orbital Dark — antigravity-dark (Flagship Slate Matte Glass)
        - Orbital Light — antigravity-light (Flagship Cloud Matte Glass)
        - Prism Dark — antigravity-prism-dark (Spectral Aurora Dark)
        - Prism Light — antigravity-prism-light (Spectral Aurora Light)
        - Zenith Dark — antigravity-zenith-dark (Deep Ocean Azure Dark)
        - Zenith Light — antigravity-zenith-light (Clear Azure Light)
        - Lagoon Dark — antigravity-lagoon-dark (Deep Lagoon Teal Dark)
        - Lagoon Light — antigravity-lagoon-light (Aqua Mineral Teal Light)
        - Solar Dark — antigravity-solar-dark (Solar Flare Amber Dark)
        - Solar Light — antigravity-solar-light (Warm Horizon Amber Light)
        - Nova Dark — antigravity-nova-dark (Deep Burgundy Crimson Dark)
        - Nova Light — antigravity-nova-light (Rose Nova Crimson Light)
        - Nebula Dark — antigravity-nebula-dark (Twilight Indigo Violet Dark)
        - Nebula Light — antigravity-nebula-light (Soft Lavender Violet Light)
        - Stock (Native Un-Themed Reset)
        - All Variants / Desktop Installer (ASAR Patcher / Auto-Heal / Self-Updater)
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected Antigravity 2.0 Surface or Component
      options:
        - Top-Right Floating Theme Switcher / Ghost Capsule (current.js)
        - Desktop Installer / ASAR Patcher / Auto-Heal / Self-Updater (install.sh / install.ps1 / core/)
        - Left-hand Sidebar
        - Chat Canvas / Thinking Block
        - Tool Call / Needs Approval Card
        - Auxiliary Pane — Subagents / Background Tasks
        - Auxiliary Pane — Artifacts (Markdown / Alerts / Mermaid / KaTeX)
        - Auxiliary Pane — Files Changed Diff
        - Auxiliary Pane — Terminals (ANSI 16-Color)
        - Auxiliary Pane — Browser Pane
        - Floating Popovers / Menus / Overview Panel Transitions
        - Embedded HTML / MCP Apps (--color-* Host CSS Variables)
        - Frosted Glass / Reduced Transparency Fallback
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment & Versions
      description: Antigravity Theme version (e.g. v0.2.0), Antigravity 2.0 host app version, OS (macOS/Windows), and display scaling.
      placeholder: "e.g., Antigravity Theme v0.2.0, Antigravity App 2.0.x, macOS Sequoia 15.4 arm64, Retina 2x"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Observed Behavior, Reproduction Steps & Doctor Output
      description: State what happened, shortest steps to reproduce, and paste `./install.sh --doctor` (macOS) or `install.ps1 -Doctor` (Windows) output if related to desktop installation. Write `NOT_ENOUGH_INFO` if unable to reproduce reliably.
      placeholder: |
        1. Installed v0.2.0 via `./install.sh --install`
        2. Switched theme to `Nebula Dark`
        3. Observed ...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Expected Behavior & Screenshot
      description: Describe the expected contrast, layout, or installer behavior and attach a screenshot if possible.
    validations:
      required: true
