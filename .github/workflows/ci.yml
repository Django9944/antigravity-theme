name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Build, Contrast & Snapshot Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build deterministic Theme Pack
        run: pnpm build

      - name: Assert dist/ & manifest.json match committed artifacts (tracked and untracked)
        run: |
          if [ -n "$(git status --porcelain dist/ manifest.json)" ]; then
            echo "dist/ or manifest.json is out of sync with src/. Run pnpm build and commit."
            git status --short dist/ manifest.json
            git diff dist/ manifest.json
            exit 1
          fi

      - name: Run Schema, Contrast, Shiki, Script & ASAR Tests
        run: pnpm test

      - name: Smoke check upstream monitor, README release sync & release packager
        run: |
          pnpm check:upstream -- --offline
          pnpm sync:readme
          if [ -n "$(git status --porcelain README.md README.zh-CN.md)" ]; then
            echo "README.md / README.zh-CN.md release history is out of sync with CHANGELOG.md. Run pnpm sync:readme."
            git diff README.md README.zh-CN.md
            exit 1
          fi
          pnpm pack:release
          rm -rf release

      - name: Upload preview workbench & compiled dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antigravity-theme-preview-bundle
          path: |
            dist/
            preview/
          retention-days: 14

  cross-platform-asar:
    name: Cross-Platform ASAR & Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Verify Unix shell script syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh install.command uninstall.command 检查更新.command

      - name: Run ASAR Engine, Updater & Sandbox Installer Tests
        run: node tests/test-asar-patcher.mjs
