name: Upstream Antigravity App Sync

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Inspect Antigravity App Changelog & Auto-Open Sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run upstream Antigravity App monitor & apply baseline update
        id: monitor
        shell: bash
        run: |
          set -euo pipefail
          REPORT=$(pnpm --silent check:upstream -- --apply)
          echo "$REPORT"
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const report = JSON.parse(fs.readFileSync(0, "utf8"));
            if (typeof report.hasChanges !== "boolean") {
              throw new Error("Invalid upstream check report payload");
            }
            const outFile = process.env.GITHUB_OUTPUT;
            const writeMultiline = (key, val) => {
              const delim = `EOF_${crypto.randomBytes(12).toString("hex")}`;
              fs.appendFileSync(outFile, `${key}<<${delim}\n${val}\n${delim}\n`);
            };
            const rawLatest = String(report.latestHeading ?? "unknown");
            const cleanLatest = rawLatest.replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").trim();
            writeMultiline("has_changes", String(report.hasChanges));
            writeMultiline("latest", cleanLatest);
            writeMultiline("added_entries", JSON.stringify(report.addedEntries ?? []));
            writeMultiline("added_host_vars", JSON.stringify(report.addedHostVariables ?? []));
          ' <<< "$REPORT"

      - name: Commit & push updated .upstream-baseline.json to sync branch
        if: steps.monitor.outputs.has_changes == 'true'
        env:
          LATEST_HEADING: ${{ steps.monitor.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SYNC_BRANCH="chore/upstream-antigravity-sync"
          git checkout -B "$SYNC_BRANCH"
          git add .upstream-baseline.json
          if [ -n "$(git status --porcelain .upstream-baseline.json)" ]; then
            git commit -m "chore(upstream): sync Antigravity App baseline (${LATEST_HEADING})"
            git push origin "$SYNC_BRANCH" --force
          fi

      - name: Open or update automated Upstream Sync PR & Tracking Issue
        if: steps.monitor.outputs.has_changes == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LATEST_HEADING: ${{ steps.monitor.outputs.latest }}
          ADDED_ENTRIES_JSON: ${{ steps.monitor.outputs.added_entries }}
          ADDED_HOST_VARS_JSON: ${{ steps.monitor.outputs.added_host_vars }}
        with:
          script: |
            const latest = process.env.LATEST_HEADING || 'unknown';
            const addedEntries = JSON.parse(process.env.ADDED_ENTRIES_JSON || '[]');
            const addedHostVars = JSON.parse(process.env.ADDED_HOST_VARS_JSON || '[]');
            const syncBranch = 'chore/upstream-antigravity-sync';

            const prTitle = `chore(upstream): sync Antigravity App baseline (${latest})`.slice(0, 256);
            const issueTitle = `[Upstream Sync] Antigravity App update detected: ${latest}`.slice(0, 256);

            const bodyLines = [
              'Automated weekly monitor detected updates under `## Antigravity App` in `https://antigravity.google/docs/changelog.md`.',
              '',
              `- **Latest heading**: \`${latest}\``,
              `- **New release entries (${addedEntries.length})**: ${addedEntries.map((e) => `\`${e}\``).join(', ') || 'None'}`,
              `- **New host CSS variables (${addedHostVars.length})**: ${addedHostVars.map((v) => `\`${v}\``).join(', ') || 'None'}`,
              '',
              '### Automated Actions Taken',
              '- Updated `.upstream-baseline.json` with the latest release heading and any newly discovered `--color-*` host CSS variables.',
              addedHostVars.length > 0
                ? '- ⚠️ **Action Required**: New `--color-*` host CSS variables were detected! Please map them in `src/tokens/semantic.ts` and `src/adapters/css-vars.ts`, run `pnpm build && pnpm test`, and push to this PR before merging.'
                : '- ✅ **Zero Breaking Host Variables**: No new `--color-*` host CSS variables were introduced. Once CI passes, this PR can be merged directly.',
            ];
            const body = bodyLines.join('\n');

            // 1. Create or update Pull Request forchore/upstream-antigravity-sync
            const openPrs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${syncBranch}`,
              base: 'main',
            });

            let prUrl = '';
            if (openPrs.data.length > 0) {
              const pr = openPrs.data[0];
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title: prTitle,
                body,
              });
              prUrl = pr.html_url;
            } else {
              const createdPr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                head: syncBranch,
                base: 'main',
                body,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: createdPr.data.number,
                labels: ['upstream-sync'],
              });
              prUrl = createdPr.data.html_url;
            }

            // 2. Open or update tracking issue linked to the automated PR
            const issueBody = `${body}\n\n- **Automated Sync PR**: ${prUrl}`;
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'upstream-sync',
              per_page: 100,
            });

            const nonPrIssues = allIssues.filter((i) => !i.pull_request);
            if (nonPrIssues.some((i) => i.title === issueTitle)) {
              return;
            }

            const openTracker = nonPrIssues.find((i) => i.state === 'open');
            if (openTracker) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openTracker.number,
                title: issueTitle,
                body: issueBody,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              labels: ['upstream-sync'],
              body: issueBody,
            });
