name: Close Stale Feedback PRs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  pull-requests: write

jobs:
  close-stale-feedback:
    name: Close PRs labeled "feedback left" after 7 days of inactivity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Sweep inactive feedback PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 7);

            for (const pr of pullRequests) {
              const hasFeedbackLabel = pr.labels.some((l) => l.name === 'feedback left');
              if (!hasFeedbackLabel) continue;
              if (new Date(pr.updated_at) >= cutoff) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: 'Closing this PR due to 7 days of inactivity after maintainer feedback. Feel free to reopen once updated!'
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed',
              });
            }
