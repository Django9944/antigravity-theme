name: Deploy Preview Workbench to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'preview/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy_pages:
    name: Build & Deploy 3-Pane Preview Workbench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble static Pages bundle (_site)
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R dist _site/dist
          cp -R preview _site/preview
          touch _site/.nojekyll
          cat <<'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=./preview/" />
            <title>Antigravity Theme — Interactive 3-Pane Preview Workbench</title>
            <script>window.location.replace('./preview/');</script>
          </head>
          <body>
            <p>Redirecting to <a href="./preview/">Antigravity Theme Preview Workbench</a>…</p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
