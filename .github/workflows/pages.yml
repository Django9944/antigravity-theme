name: Deploy Preview Workbench to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'preview/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy_pages:
    name: Build & Deploy 3-Pane Preview Workbench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Assemble static Pages bundle (_site)
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R dist _site/dist
          cp -R preview _site/preview
          touch _site/.nojekyll
          cat <<'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=./preview/" />
            <title>Antigravity Theme — Interactive 3-Pane Preview Workbench</title>
            <script>window.location.replace('./preview/');</script>
          </head>
          <body>
            <p>Redirecting to <a href="./preview/">Antigravity Theme Preview Workbench</a>…</p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
