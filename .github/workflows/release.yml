name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      replay_version:
        description: 'Existing release version to replay idempotently (e.g. 1.0.0, without v prefix)'
        required: false
        type: string
      target:
        description: 'Target channel when replaying'
        required: false
        default: both
        type: choice
        options:
          - both
          - github
          - npm

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify Gates & Detect Pending Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install & Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          test -z "$(git status --porcelain dist/)"
          pnpm test

      - name: Detect pending changeset files
        id: detect
        run: |
          count=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

  version_pr:
    name: Open or Update Changesets Version PR
    needs: prepare
    if: ${{ github.event_name == 'push' && needs.prepare.outputs.has_changesets == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm ci:version
          title: 'chore(release): version Antigravity Theme packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_release:
    name: Pack & Publish Theme Pack
    needs: prepare
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.prepare.outputs.has_changesets == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Validate dispatch replay inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REPLAY_VERSION: ${{ inputs.replay_version }}
        run: |
          if [ -z "$REPLAY_VERSION" ]; then
            echo "replay_version is required for workflow_dispatch replay."
            exit 1
          fi
          if ! echo "$REPLAY_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid SemVer replay_version: $REPLAY_VERSION"
            exit 1
          fi

      - name: Checkout release commit or tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.replay_version) || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js 24 (OIDC Trusted Publishing ready)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const ver = execSync("npm -v", { encoding: "utf8" }).trim().split(".").map(Number);
            const ok = ver[0] > 11 || (ver[0] === 11 && (ver[1] > 5 || (ver[1] === 5 && ver[2] >= 1)));
            if (!ok) {
              console.log("Upgrading npm to latest for OIDC provenance support...");
              execSync("npm install -g npm@latest", { stdio: "inherit" });
            }
          '
          npm -v

      - name: Install dependencies & verify clean dist/
        env:
          REPLAY_VERSION: ${{ inputs.replay_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          test -z "$(git status --porcelain dist/)"
          pnpm test
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node -e '
              const fs = require("node:fs");
              const expected = process.env.REPLAY_VERSION;
              const pkgVer = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
              const distVer = JSON.parse(fs.readFileSync("dist/manifest.json", "utf8")).version;
              if (pkgVer !== expected || distVer !== expected) {
                throw new Error(`Tag mismatch: expected ${expected}, pkg=${pkgVer}, dist=${distVer}`);
              }
            '
          fi

      - name: Publish via Changesets (OIDC npm + GitHub tag/release)
        if: ${{ github.event_name == 'push' }}
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm ci:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Replay npm publish idempotently (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'npm') }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm ci:publish

      - name: Upload Theme Pack ZIP & SHA256SUMS to GitHub Release
        if: ${{ (github.event_name == 'push' && steps.changesets.outputs.published == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'github')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm pack:release
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "Antigravity Theme $TAG" --generate-notes
          fi
