name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      replay_version:
        description: 'Existing release version to replay idempotently (e.g. 0.1.0, without v prefix)'
        required: false
        type: string
      target:
        description: 'Target channel when replaying'
        required: false
        default: both
        type: choice
        options:
          - both
          - github
          - npm

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify Gates & Detect Pending Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
      version: ${{ steps.detect.outputs.version }}
      needs_github_release: ${{ steps.detect.outputs.needs_github_release }}
      needs_npm_publish: ${{ steps.detect.outputs.needs_npm_publish }}
      needs_auto_patch_pr: ${{ steps.detect.outputs.needs_auto_patch_pr }}
      next_patch_version: ${{ steps.detect.outputs.next_patch_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install & Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          test -z "$(git status --porcelain dist/ manifest.json)"
          pnpm test

      - name: Detect pending changeset files & release state
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "needs_github_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_github_release=true" >> "$GITHUB_OUTPUT"
          fi

          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "needs_npm_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_npm_publish=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$count" -eq 0 ] && gh release view "$TAG" >/dev/null 2>&1; then
            PATCH_INFO="$(node scripts/prepare-auto-patch-changeset.mjs --check --json)"
            echo "$PATCH_INFO"
            SHOULD_PATCH="$(node -e "const d = JSON.parse(process.argv[1]); console.log(d.shouldRelease ? 'true' : 'false');" "$PATCH_INFO")"
            NEXT_PATCH="$(node -e "const d = JSON.parse(process.argv[1]); console.log(d.nextPatchVersion || '');" "$PATCH_INFO")"
            echo "needs_auto_patch_pr=${SHOULD_PATCH}" >> "$GITHUB_OUTPUT"
            echo "next_patch_version=${NEXT_PATCH}" >> "$GITHUB_OUTPUT"
          else
            echo "needs_auto_patch_pr=false" >> "$GITHUB_OUTPUT"
            echo "next_patch_version=" >> "$GITHUB_OUTPUT"
          fi

  auto_patch_pr:
    name: Open or Update Auto-Patch Release PR
    needs: prepare
    if: ${{ github.event_name == 'push' && needs.prepare.outputs.has_changesets == 'false' && needs.prepare.outputs.needs_github_release == 'false' && needs.prepare.outputs.needs_auto_patch_pr == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies & generate patch version bump
        id: bump
        run: |
          pnpm install --frozen-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/auto-patch-release
          node scripts/prepare-auto-patch-changeset.mjs --write > /tmp/patch-info.json
          cat /tmp/patch-info.json
          pnpm ci:version
          NEXT_VER="$(node -p "require('./package.json').version")"
          echo "next_version=${NEXT_VER}" >> "$GITHUB_OUTPUT"
          git add -A
          git commit -m "chore(release): prepare v${NEXT_VER}"
          git push origin chore/auto-patch-release --force

      - name: Open or update Auto-Patch Release PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEXT_VER: ${{ steps.bump.outputs.next_version }}
        with:
          script: |
            const fs = require('node:fs');
            const nextVer = process.env.NEXT_VER;
            const info = JSON.parse(fs.readFileSync('/tmp/patch-info.json', 'utf8'));
            const branch = 'chore/auto-patch-release';
            const title = `chore(release): release v${nextVer}`;
            const commitLines = (info.commits || []).map((c) => `- ${c.subject} (\`${c.shortSha}\`)`).join('\n');
            const body = [
              `Automated patch release prepared from unreleased commits on \`main\` since \`${info.baseRef}\`.`,
              '',
              '### Included Changes',
              commitLines || '- Maintenance & host compatibility updates',
              '',
              '### Automated Actions',
              `- Bumped version to \`v${nextVer}\` via Changesets (\`patch\`)`,
              '- Rebuilt `dist/` & `manifest.json` (`pnpm build`)',
              '- Synchronized `CHANGELOG.md`, `README.md`, and `README.zh-CN.md` (`pnpm sync:readme`)',
              '',
              'Merging this PR will trigger `Release` to pack and publish `v' + nextVer + '`.',
            ].join('\n');

            const openPrs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              base: 'main',
            });

            if (openPrs.data.length > 0) {
              const pr = openPrs.data[0];
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title,
                body,
              });
              return;
            }

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: branch,
              base: 'main',
              body,
            });

  version_pr:
    name: Open or Update Changesets Version PR
    needs: prepare
    if: ${{ github.event_name == 'push' && needs.prepare.outputs.has_changesets == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Version Packages PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm ci:version
          title: 'chore(release): version Antigravity Theme packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_release:
    name: Pack & Publish Theme Pack
    needs: prepare
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        needs.prepare.outputs.has_changesets == 'false' &&
        (
          needs.prepare.outputs.needs_github_release == 'true' ||
          (needs.prepare.outputs.needs_npm_publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Validate dispatch replay inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REPLAY_VERSION: ${{ inputs.replay_version }}
        run: |
          if [ -z "$REPLAY_VERSION" ]; then
            echo "replay_version is required for workflow_dispatch replay."
            exit 1
          fi
          if ! echo "$REPLAY_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid SemVer replay_version: $REPLAY_VERSION"
            exit 1
          fi

      - name: Checkout release commit or tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.replay_version) || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js 24 (OIDC Trusted Publishing ready)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const ver = execSync("npm -v", { encoding: "utf8" }).trim().split(".").map(Number);
            const ok = ver[0] > 11 || (ver[0] === 11 && (ver[1] > 5 || (ver[1] === 5 && ver[2] >= 1)));
            if (!ok) {
              console.log("Upgrading npm to latest for OIDC provenance support...");
              execSync("npm install -g npm@latest", { stdio: "inherit" });
            }
          '
          npm -v

      - name: Install dependencies & verify clean dist/
        env:
          REPLAY_VERSION: ${{ inputs.replay_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          test -z "$(git status --porcelain dist/ manifest.json)"
          pnpm test
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node -e '
              const fs = require("node:fs");
              const expected = process.env.REPLAY_VERSION;
              const pkgVer = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
              const distVer = JSON.parse(fs.readFileSync("dist/manifest.json", "utf8")).version;
              if (pkgVer !== expected || distVer !== expected) {
                throw new Error(`Tag mismatch: expected ${expected}, pkg=${pkgVer}, dist=${distVer}`);
              }
            '
          fi

      - name: Create or update GitHub Release with Theme Pack ZIPs & SHA256SUMS.txt
        if: ${{ (github.event_name == 'push' && needs.prepare.outputs.needs_github_release == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'github')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm pack:release
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          pnpm sync:readme -- --version "$VERSION" --write-notes /tmp/RELEASE_NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Antigravity Theme ${TAG}" --notes-file /tmp/RELEASE_NOTES.md
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --target "${GITHUB_SHA}" \
              --title "Antigravity Theme ${TAG}" \
              --notes-file /tmp/RELEASE_NOTES.md
          fi

      - name: Publish to npm Registry (when NPM_TOKEN or NPM_PUBLISH_ENABLED is configured)
        if: ${{ (github.event_name == 'push' && needs.prepare.outputs.needs_npm_publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'npm')) }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm ci:publish
